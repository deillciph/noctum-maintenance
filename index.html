<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noctum - Sitio en renovación</title>
  <meta name="description" content="Noctum está preparando una nueva versión de su sitio web.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07090d">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">

  <style>
    :root{
      color-scheme: dark;
      --bg:#07090d;
      --ink:#0b0d12;
      --ivory:#f0e3c3;
      --gold:#d7a652;
      --gold-hi:#f0cf86;
      --gold-deep:#9b6429;
      --red:#d30d2b;
      --red-deep:#6d0716;
      --muted:#8f8a81;
    }

    *{box-sizing:border-box}
    html,body{min-height:100%}

    body{
      margin:0;
      min-height:100vh;
      overflow:hidden;
      display:grid;
      place-items:center;
      color:var(--ivory);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:
        radial-gradient(circle at 16% 18%, rgba(54,79,99,.20), transparent 28rem),
        radial-gradient(circle at 84% 78%, rgba(120,20,35,.13), transparent 30rem),
        linear-gradient(145deg,#050609 0%,#0a0d13 48%,#07080b 100%);
    }

    .vignette{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
      background:radial-gradient(circle at center,transparent 0%,transparent 44%,rgba(0,0,0,.38) 74%,rgba(0,0,0,.84) 100%);
    }

    .petals{
      position:fixed;
      inset:0;
      overflow:hidden;
      pointer-events:none;
    }

    .petals-back{
      z-index:1;
    }

    .petals-front{
      z-index:4;
    }

    .petals-front .petal{
      opacity:.34;
    }

    .petal{
      position:absolute;
      left:0;
      top:0;
      width:var(--size);
      height:auto;
      opacity:0;
      transform-origin:50% 50%;
      will-change:transform,opacity;
      pointer-events:none;
      user-select:none;
    }

    .petal img{
      display:block;
      width:100%;
      height:auto;
      filter:drop-shadow(0 0 5px rgba(180,0,25,.16));
      pointer-events:none;
    }

    main{
      width:min(94vw,980px);
      position:relative;
      z-index:3;
      padding:1rem;
    }

    .poster{
      position:relative;
      overflow:hidden;
      min-height:560px;
      border:1px solid rgba(215,166,82,.14);
      background:
        radial-gradient(circle at 86% 16%,rgba(215,166,82,.045),transparent 17rem),
        radial-gradient(circle at 18% 86%,rgba(180,10,35,.045),transparent 20rem),
        linear-gradient(180deg,rgba(15,17,23,.96),rgba(8,10,14,.97));
      box-shadow:0 38px 120px rgba(0,0,0,.75);
    }

    .poster::before{
      content:"";
      position:absolute;
      inset:18px;
      border:1px solid rgba(215,166,82,.055);
      pointer-events:none;
    }

    .content{
      position:relative;
      display:grid;
      grid-template-columns:112px 1fr;
      min-height:560px;
    }

    .ornament{
      position:relative;
      border-right:1px solid rgba(215,166,82,.16);
      background:linear-gradient(180deg,rgba(215,166,82,.025),transparent 42%,rgba(215,166,82,.02));
    }

    .symbols{
      position:absolute;
      top:54px;
      bottom:54px;
      left:50%;
      transform:translateX(-50%);
      width:62px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
      color:rgba(215,166,82,.78);
    }

    .symbol{
      width:34px;
      height:34px;
      border:1px solid currentColor;
      transform:rotate(45deg);
      position:relative;
      opacity:.78;
    }

    .symbol::before,
    .symbol::after{
      content:"";
      position:absolute;
      inset:7px;
      border:1px solid currentColor;
    }

    .symbol::after{
      inset:13px;
      background:currentColor;
    }

    .maincopy{
      position:relative;
      padding:74px 70px 58px 66px;
    }

    .kicker{
      color:#9d7845;
      font-family:Georgia,"Times New Roman",serif;
      font-size:.76rem;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.26em;
      margin-bottom:1.15rem;
    }

    .brand{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(4.7rem,12vw,8.9rem);
      line-height:.82;
      letter-spacing:-.045em;
      font-weight:700;
      text-transform:uppercase;
      background:
        radial-gradient(circle at 17% 25%,rgba(255,245,203,.95) 0 1.4%,transparent 2.4%),
        radial-gradient(circle at 68% 53%,rgba(126,76,24,.62) 0 1.1%,transparent 2.1%),
        linear-gradient(180deg,#f2d58d 0%,#d6a854 27%,#efcd80 47%,#9f672a 70%,#e4b766 84%,#87521f 100%);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      -webkit-text-stroke:.35px rgba(255,224,150,.16);
      text-shadow:0 3px 15px rgba(68,37,8,.23);
    }

    .red-script{
      margin:.4rem 0 0;
      color:var(--red);
      font-family:"Brush Script MT","Segoe Script",cursive;
      font-size:clamp(1.45rem,3vw,2.2rem);
      transform:rotate(-2deg);
      opacity:.93;
    }

    h1{
      margin:1.65rem 0 .7rem;
      max-width:690px;
      color:#e2c58d;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(1.6rem,4vw,2.65rem);
      line-height:1.08;
      font-weight:600;
      letter-spacing:-.03em;
    }

    p{
      margin:0;
      max-width:650px;
      color:#918d84;
      font-size:clamp(1rem,2vw,1.08rem);
      line-height:1.8;
    }

    .divider{
      width:100%;
      height:1px;
      margin:2.05rem 0 1.15rem;
      background:linear-gradient(90deg,rgba(215,166,82,.28),rgba(215,166,82,.03),transparent);
    }

    .bottom{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:1rem;
      color:#66645f;
      font-size:.84rem;
    }

    .message-block{
      max-width:760px;
      padding-top:18px;
    }

    .fall-title{
      margin:0 0 .55rem;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(1.9rem,3.8vw,3.25rem);
      line-height:1.02;
      letter-spacing:-.025em;
      font-weight:700;
      text-transform:uppercase;
      white-space:nowrap;
      color:#d8aa59;
      text-shadow:
        0 1px 0 rgba(255,235,190,.22),
        0 2px 6px rgba(84,45,8,.24),
        0 0 18px rgba(215,166,82,.055);
    }

    .penance-title{
      margin:0 0 1.45rem;
      color:#e7c98f;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(1.35rem,3.3vw,2.45rem);
      line-height:1.08;
      letter-spacing:.005em;
      font-weight:700;
      text-transform:uppercase;
    }

    .quote-line{
      display:flex;
      align-items:center;
      gap:0;
      max-width:680px;
      color:#b3aea5;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(1rem,2vw,1.18rem);
      line-height:1.7;
    }

    .lower-block{
      margin-top:5.1rem;
      padding-top:1.7rem;
      border-top:1px solid rgba(215,166,82,.12);
      width:min(100%,690px);
    }

    .lower-title{
      color:#d5b271;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(1rem,2.1vw,1.28rem);
      font-weight:700;
      letter-spacing:.045em;
    }

    .coming-soon{
      margin-top:.35rem;
      color:#8e8a82;
      font-family:Georgia,"Times New Roman",serif;
      font-size:1rem;
      font-style:italic;
    }

    .music-control{
      position:fixed;
      top:18px;
      left:18px;
      z-index:20;
      display:flex;
      align-items:flex-start;
      gap:.55rem;
      user-select:none;
    }

    .music-button{
      width:42px;
      height:42px;
      padding:0;
      display:grid;
      place-items:center;
      border:1px solid rgba(215,166,82,.28);
      border-radius:50%;
      background:rgba(8,10,14,.84);
      color:#d9b66f;
      box-shadow:0 12px 34px rgba(0,0,0,.36);
      cursor:pointer;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease,
        color .18s ease;
    }

    .music-button:hover{
      transform:translateY(-1px);
      border-color:rgba(215,166,82,.52);
      background:rgba(17,16,15,.92);
      color:#f0cf86;
    }

    .music-button.active{
      border-color:rgba(215,166,82,.58);
      color:#f0cf86;
      box-shadow:
        0 12px 34px rgba(0,0,0,.36),
        0 0 24px rgba(215,166,82,.10);
    }

    .music-note{
      font-family:Georgia,"Times New Roman",serif;
      font-size:1.25rem;
      line-height:1;
      transform:translateY(-1px);
    }

    .volume-popover{
      width:0;
      height:42px;
      overflow:hidden;
      opacity:0;
      border:1px solid transparent;
      border-radius:999px;
      background:rgba(8,10,14,.84);
      box-shadow:0 12px 34px rgba(0,0,0,.32);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      transition:
        width .24s ease,
        opacity .18s ease,
        border-color .18s ease,
        padding .24s ease;
      display:flex;
      align-items:center;
      gap:.55rem;
      padding:0;
      pointer-events:none;
    }

    .volume-popover.open{
      width:170px;
      opacity:1;
      border-color:rgba(215,166,82,.18);
      padding:0 .9rem;
      pointer-events:auto;
    }

    .volume-icon{
      color:#9e8557;
      font-size:.86rem;
      line-height:1;
      flex:0 0 auto;
    }

    .volume-slider{
      width:138px;
      height:3px;
      appearance:none;
      -webkit-appearance:none;
      border-radius:999px;
      background:
        linear-gradient(
          90deg,
          #d6a854 0%,
          #d6a854 var(--volume, 38%),
          rgba(255,255,255,.10) var(--volume, 38%),
          rgba(255,255,255,.10) 100%
        );
      outline:none;
      cursor:pointer;
    }

    .volume-slider::-webkit-slider-thumb{
      appearance:none;
      -webkit-appearance:none;
      width:11px;
      height:11px;
      border-radius:50%;
      background:#e7c98f;
      border:0;
      box-shadow:0 0 0 3px rgba(215,166,82,.08);
    }

    .volume-slider::-moz-range-thumb{
      width:11px;
      height:11px;
      border-radius:50%;
      background:#e7c98f;
      border:0;
      box-shadow:0 0 0 3px rgba(215,166,82,.08);
    }

    @media(max-width:720px){
      body{overflow:auto}
      main{padding:.45rem}
      .poster{min-height:auto}
      .content{grid-template-columns:1fr}
      .ornament{display:none}
      .maincopy{padding:3.2rem 1.45rem 2.2rem}
      .fall-title{white-space:normal;font-size:clamp(2rem,10.5vw,3.1rem)}
      .lower-block{margin-top:3.4rem}
      .brand{font-size:clamp(3.6rem,19vw,6rem)}
      .bottom{flex-direction:column;align-items:flex-start}
      .rose{right:10px;bottom:10px;width:86px;height:86px}
    }

    @media(max-width:480px){
      .music-control{
        top:12px;
        left:12px;
        gap:.4rem;
      }

      .music-button{
        width:40px;
        height:40px;
      }

      .volume-popover{
        height:40px;
      }

      .volume-popover.open{
        width:min(150px,calc(100vw - 68px));
        padding:0 .75rem;
      }

      .volume-slider{
        width:100%;
        min-width:0;
      }

      .volume-slider::-webkit-slider-thumb{
        width:15px;
        height:15px;
      }

      .volume-slider::-moz-range-thumb{
        width:15px;
        height:15px;
      }
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.001ms!important;
        animation-iteration-count:1!important;
      }
    }
  </style>

<body>
  <div class="music-control" aria-label="Controles de ambientación">
    <button
      class="music-button"
      id="musicButton"
      type="button"
      aria-label="Activar ambientación"
      aria-pressed="false"
      title="Ambientación"
    >
      <span class="music-note" aria-hidden="true">♪</span>
    </button>

    <div class="volume-popover" id="volumePopover">
      <input
        class="volume-slider"
        id="volumeSlider"
        type="range"
        min="0"
        max="100"
        step="1"
        value="38"
        aria-label="Volumen de ambientación"
      >
    </div>

    <audio id="ambientAudio" loop preload="auto"><source src="ambientacion.mp3" type="audio/mpeg"></audio>
  </div>
<div class="petals petals-back" id="petalsBack" aria-hidden="true"></div>
  <div class="petals petals-front" id="petalsFront" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main>
    <section class="poster" aria-labelledby="title">
      <div class="content">
        <aside class="ornament" aria-hidden="true">
          <div class="symbols">
            <div class="symbol"></div>
            <div class="symbol"></div>
            <div class="symbol"></div>
            <div class="symbol"></div>
            <div class="symbol"></div>
          </div>
        </aside>

        <div class="maincopy">
          <div class="message-block">
            <div class="fall-title">LA WEB HA CAÍDO.</div>
            <div class="penance-title">MAS LA PENITENCIA CONTINÚA.</div>

            <div class="quote-line">
              <em>Y, una vez más, la historia habrá de repetirse.</em>
            </div>
          </div>

          <div class="lower-block">
            <div class="lower-title">NOCTUM - EXPEDITION 33</div>
            <div class="coming-soon">Próximamente.</div>

          </div>
          </div>
        </div>
      </div>
    </section>
  </main>
<script>
  (() => {
    const button = document.getElementById('musicButton');
    const popover = document.getElementById('volumePopover');
    const slider = document.getElementById('volumeSlider');
    const audio = document.getElementById('ambientAudio');

    const setVolume = () => {
      const value = Number(slider.value);
      audio.volume = value / 100;
      slider.style.setProperty('--volume', `${value}%`);
    };

    const setPlaying = (playing) => {
      button.classList.toggle('active', playing);
      button.setAttribute('aria-pressed', String(playing));
      button.setAttribute(
        'aria-label',
        playing ? 'Pausar ambientación' : 'Activar ambientación'
      );
    };

    setVolume();
    audio.load();

    button.addEventListener('click', async () => {
      const opening = !popover.classList.contains('open');
      popover.classList.toggle('open', opening);

      if (!opening) {
        audio.pause();
        setPlaying(false);
        return;
      }

      try {
        await audio.play();
        setPlaying(true);
      } catch (error) {
        setPlaying(false);
        console.error('No se pudo reproducir ambientacion.mp3:', error);
      }
    });

    slider.addEventListener('input', setVolume);

    audio.addEventListener('play', () => setPlaying(true));
    audio.addEventListener('pause', () => setPlaying(false));
    audio.addEventListener('error', () => {
      setPlaying(false);
      console.error('No se encontró o no se pudo cargar ambientacion.mp3');
    });
  })();
  </script>

      p.vy=rand(-132,-82);
      p.pull=rand(.78,1.48);
      p.turb=rand(.68,1.95);
      p.lift=rand(.84,1.28);
      p.arc=rand(.95,1.90);
      p.a=rand(0,Math.PI*2);
      p.b=rand(0,Math.PI*2);
      p.c=rand(0,Math.PI*2);
      p.d=rand(0,Math.PI*2);
      p.rot=rand(0,360);
      p.rotVel=rand(-120,120);
      p.flip=rand(0,Math.PI*2);
      p.flipSpeed=rand(.82,2.10);
      p.size=rand(mobile?14:16,mobile?39:48);
      if(Math.random()<.14)p.size*=rand(1.12,1.40);
      p.alpha=rand(p.frontLayer?.18:.48,p.frontLayer?.46:.94);
      p.life=0;
      p.maxLife=rand(10.5,18.0);
      p.delay=initial?0:rand(.04,.95);
      p.el.style.setProperty('--size',`${p.size}px`);
      p.img.src=sprites[Math.floor(Math.random()*sprites.length)];
      p.el.style.filter=(!mobile&&Math.random()<.14)?`blur(${rand(.2,.75).toFixed(2)}px)`:'none';
      p.el.style.opacity='0';

      if(initial){
        const targetAge=rand(p.maxLife*.08,p.maxLife*.92);
        const step=.032;
        while(p.life<targetAge){
          advance(p,step,true);
          if(p.y<-220||p.x<-320||p.life>p.maxLife)break;
        }
      }
    }

    function advance(p,dt,warm=false){
      p.life+=dt;
      p.a+=dt*(1.18+p.turb);
      p.b+=dt*(.72+p.turb*.49);
      p.c+=dt*(.40+p.turb*.24);
      p.d+=dt*.26;
      p.flip+=dt*p.flipSpeed;

      const hp=clamp(1-p.y/Math.max(h,1),0,1);
      const xp=clamp(p.x/Math.max(w,1),0,1);
      const gust=1+Math.sin(windTime*.25)*.15+Math.sin(windTime*.69+1.9)*.10+Math.sin(windTime*1.31+4.2)*.05;
      const sweep=Math.sin(windTime*.17+2.2)*16+Math.sin(windTime*.47)*8;

      const ex=
        Math.sin(p.a)*(12+10*p.turb)+
        Math.sin(p.b*1.55+1.2)*8+
        Math.sin((p.y/Math.max(h,1))*5.0+p.c)*6+
        Math.sin((p.x/Math.max(w,1))*4.3+p.d)*5;

      const ey=
        Math.sin(p.b*.82+2.1)*4.7+
        Math.sin(p.a*.38)*2.8+
        Math.sin(p.c*1.18)*2;

      const leftBase=xp>.70?72:(xp>.38?34:18);
      const left=(10+leftBase*hp*p.arc+12*xp)*gust*p.pull;
      const spread=(1-hp)*(xp>.80?10:(xp>.38?6:3));

      p.vx+=(-left*.34+spread*.15+ex*.026+sweep*.012)*dt;
      p.vy+=(-7.6*gust*p.lift+ey*.040)*dt;

      p.vx*=Math.pow(.990,dt*60);
      p.vy*=Math.pow(.996,dt*60);

      p.x+=(p.vx+ex*.98+sweep*.22)*dt;
      p.y+=(p.vy+ey)*dt;
      p.rot+=(p.rotVel+Math.sin(p.b)*24)*dt;

      if(!warm){
        const flip=.28+Math.abs(Math.cos(p.flip))*.82;
        const sy=.92+Math.sin(p.a*.64)*.075;
        const skew=Math.sin(p.a)*7.5;
        const fadeIn=clamp(p.life/.48,0,1);
        const topFade=clamp((p.y+160)/320,0,1);
        const leftFade=clamp((p.x+240)/520,0,1);
        const ageFade=clamp((p.maxLife-p.life)/1.35,0,1);
        const opacity=p.alpha*fadeIn*Math.min(topFade,leftFade,ageFade);

        p.el.style.opacity=opacity.toFixed(3);
        p.el.style.transform=
          `translate3d(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px,0) `+
          `rotate(${p.rot.toFixed(1)}deg) `+
          `skewX(${skew.toFixed(1)}deg) `+
          `scale(${flip.toFixed(2)},${sy.toFixed(2)})`;
      }
    }

    const backCount=reduced?14:(mobile?48:92);
    const frontCount=reduced?0:(mobile?8:16);

    for(let i=0;i<backCount;i++)makePetal(back,false);
    for(let i=0;i<frontCount;i++)makePetal(front,true);

    function frame(now){
      const dt=Math.min((now-last)/1000,.035);
      last=now;
      windTime+=dt;

      for(const p of petals){
        if(p.delay>0){
          p.delay-=dt;
          continue;
        }

        advance(p,dt,false);

        if(
          p.life>p.maxLife||
          p.y<-230||
          p.x<-340||
          p.x>w+280
        )reset(p,false);
      }

      requestAnimationFrame(frame);
    }

    addEventListener('resize',()=>{
      w=innerWidth;
      h=innerHeight;
    },{passive:true});

    requestAnimationFrame(frame);
  })();
  </script>

</body>
